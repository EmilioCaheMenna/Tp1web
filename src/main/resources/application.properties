spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com


# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5433/tp2_db?options=-c%20timezone=UTC
spring.datasource.username=usuario
spring.datasource.password=password

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.url=jdbc:postgresql://localhost:5433/tp2_db?options=-c%20timezone=UTC
spring.flyway.user=usuario
spring.flyway.password=password
