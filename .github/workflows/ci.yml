name: CI - Tests y Migraciones

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución a mvnw
        run: chmod +x ./mvnw

      - name: Compilar y ejecutar pruebas unitarias (*Test) y de integración (*IT con Testcontainers y Flyway)
        run: ./mvnw clean verify
