spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}

# PostgreSQL Connection (con variables de entorno y valores por defecto para local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tp2_db?options=-c%20timezone=UTC}
spring.datasource.username=${DB_USERNAME:usuario}
spring.datasource.password=${DB_PASSWORD:password}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET:claveSecretaMuySeguraParaFirmarTokensJwtEnElTp3DeWeb2Unvime2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
